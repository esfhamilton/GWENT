<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>GWENT</title>
        <meta name="description" content="A browser based platform for playing the card game GWENT.">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <main class="app-shell">
            <h1 class="page-heading">Choose your Faction</h1>
            <div class="page-content panel menu-panel">
                <select name="faction" id="faction">
                    <option value="NR">Northern Realms</option>
                    <option value="NG">Nilfgaard</option>
                    <option value="ST">Scoia'Tael</option>
                    <option value="MO">Monsters</option>
                    <option value="ALL">All</option>
                </select>
                <div class="faction-perk-choice" id="factionPerkChoice" hidden>
                    <label for="perkFaction">Choose your faction perk</label>
                    <select name="perkFaction" id="perkFaction">
                        <option value="NR">Northern Realms</option>
                        <option value="NG">Nilfgaard</option>
                        <option value="ST">Scoia'Tael</option>
                        <option value="MO">Monsters</option>
                    </select>
                </div>
                <p class="faction-perk" id="factionPerk" aria-live="polite"></p>
                <button class="btn" onclick="submit()">Next</button>
            </div>
        </main>
        
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qs/6.9.4/qs.min.js" 
                integrity="sha256-ijqLssetA1NMNjZ+w1zaUafQQLm4IW5OoM8O+4tatME=" 
                crossorigin="anonymous">
        </script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="/socket.io/socket.io.js"></script>
        <script src="js/deckRules.js"></script>
        <script src="js/faction.js"></script>
    </body>
</html>

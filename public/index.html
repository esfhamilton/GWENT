<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>GWENT</title>
        <meta name="description" content="A browser based platform for playing the card game GWENT.">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <main class="app-shell">
            <h1 class="page-heading">GWENT Online</h1>
            <div class="page-content panel menu-panel">
                <form class="menu-form" action="lobby.html">
                    <button class="btn">CREATE ROOM</button>
                </form>
                <form class="menu-form" action="lobby.html">
                    <button class="btn">JOIN GAME</button>
                    <input pattern=".{5}" required title="5 Digit length" type="text" name="SID" placeholder="Enter Session ID" required>
                </form>
            </div>
            <footer class="page-footer">
                <p>An unofficial fan work under the Gwent Fan Content Guidelines. Not approved or endorsed by CD PROJEKT RED.</p>
                <p>Developed by esfhamilton</p>
            </footer>
        </main>
    </body>
</html>

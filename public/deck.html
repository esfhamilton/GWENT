<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/deckQueries.css">
        <title>GWENT</title>
    </head>
    <body>
        <main class="app-shell">
            <h1 class="page-heading">Build your Deck</h1>
            <div class="page-content panel deck-panel">
                <p class="info" id="info">Select a Leader and click on the cards in the Available column below to add them to your deck. When you're ready press the Next button to continue.</p>
                <div class="deck-actions">
                    <button class="btn btn-secondary suggestDeckBtn" id="suggestDeckBtn" type="button" onclick="suggestDeck()">Suggest Deck</button>
                    <button class="btn" type="button" onclick="submit()">Next</button>
                </div>
                <div class="leaders" id="leaderSection">
                    <h3>Leader</h3>
                </div>
                <div class="deck-progress">
                    <p class="unitCardCount" id="unitCardCount" aria-live="polite">Unit Cards: 0/22</p>
                </div>
                <div class="deck-columns">
                    <div class="column" id="availableCards">
                        <h3>Available</h3>
                    </div>
                    <div class="column" id="currentDeck">
                        <h3>Current Deck</h3>
                    </div>
                </div>
            </div>
        </main>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qs/6.9.4/qs.min.js" 
                integrity="sha256-ijqLssetA1NMNjZ+w1zaUafQQLm4IW5OoM8O+4tatME=" 
                crossorigin="anonymous">
        </script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="/socket.io/socket.io.js"></script>
        <script src="js/constants.js"></script>
        <script src="js/deck.js"></script>
    </body>
</html>

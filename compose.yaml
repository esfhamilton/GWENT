services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: gwent
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  gwent:
    build: .
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      NODE_ENV: production
      PORT: "5000"
    restart: unless-stopped

volumes:
  tailscale-state:
